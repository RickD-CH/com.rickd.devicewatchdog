<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light dark;
      --ww-text: #1a1a1a;
      --ww-muted: #767676;
      --ww-border: #e0e0e0;
      --ww-ok: #2e7d32;
      --ww-nok: #d32f2f;
      --ww-chip-bg: #f2f2f2;
      --ww-bg: #ffffff;
    }
    /* prefers-color-scheme reads the OS theme, which isn't necessarily the same as the
       Homey app's own theme setting - the two can disagree (e.g. phone in light mode,
       Homey app set to dark), leaving light-mode text colors on Homey's actual dark
       background. Homey applies its own .homey-dark-mode class based on the app's real
       theme regardless of OS setting - that's the authoritative signal, kept here
       alongside the media query as a fallback for contexts that don't set the class. */
    @media (prefers-color-scheme: dark) {
      :root {
        --ww-text: #f2f2f2;
        --ww-muted: #a0a0a0;
        --ww-border: #3a3a3a;
        --ww-ok: #66bb6a;
        --ww-nok: #ef5350;
        --ww-chip-bg: #2a2a2a;
        --ww-bg: #1e1e20;
      }
    }
    .homey-dark-mode {
      --ww-text: #f2f2f2;
      --ww-muted: #a0a0a0;
      --ww-border: #3a3a3a;
      --ww-ok: #66bb6a;
      --ww-nok: #ef5350;
      --ww-chip-bg: #2a2a2a;
      --ww-bg: #1e1e20;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px; color: var(--ww-text);
      /* Solid, theme-matched fill instead of transparent: some embedding contexts (e.g.
         the widget shown on a device's own detail page, vs. the Dashboard grid) don't
         reliably paint their surrounding card in the same light/dark shade we detect via
         prefers-color-scheme/.homey-dark-mode - a transparent body then left dark-mode
         text (near-white) sitting on a host card that stayed white, unreadable. Filling
         our own background guarantees text and background always agree, regardless of
         what the host draws around us. Colors are chosen to match Homey's own card
         background in both themes, so this stays visually seamless in the normal case. */
      background: var(--ww-bg);
      padding: 10px 12px 16px;
    }
    .counts { display: flex; gap: 8px; }
    .chip {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 6px 4px; border-radius: 8px; background: var(--ww-chip-bg);
      border: 1px solid transparent; -webkit-tap-highlight-color: transparent;
      transition: background-color .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .chip.warn { border-color: var(--ww-nok); }
    /* Distinct from .warn (which only means "has problems") - this is the one whose
       list is actually shown below, so it needs its own unmistakable visual state. */
    .chip.active { box-shadow: inset 0 0 0 2px var(--ww-text); }
    .chip .num { font-size: 17px; font-weight: 700; }
    .chip.warn .num { color: var(--ww-nok); }
    .chip .lbl { font-size: 10px; color: var(--ww-muted); text-align: center; }
    .section {
      margin-top: 8px; border-top: 1px solid var(--ww-border); padding-top: 6px;
      animation: ww-fade-in .15s ease;
    }
    @keyframes ww-fade-in { from { opacity: 0; } to { opacity: 1; } }
    .section h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; color: var(--ww-muted); font-weight: 600; }
    /* No internal cap/scroll here on purpose - the widget itself grows to fit the list
       (see resizeToContent), so someone with many affected devices sees all of them
       instead of scrolling inside a tiny box. */
    .device-list { display: flex; flex-direction: column; gap: 6px; max-height: 640px; overflow-y: auto; }
    .device-row { font-size: 12px; line-height: 1.35; }
    .device-row .name { font-weight: 600; }
    .device-row .zone { color: var(--ww-muted); font-weight: 400; }
    .device-row .detail { color: var(--ww-muted); font-size: 11px; }
    .footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--ww-border);
    }
    .scan-btn {
      border: none; background: var(--ww-chip-bg); color: var(--ww-text); border-radius: 8px;
      padding: 9px 16px; font-size: 13px; -webkit-tap-highlight-color: transparent;
      transition: opacity .15s ease;
    }
    .scan-btn:disabled { opacity: .5; }
    .last-scan { font-size: 10px; color: var(--ww-muted); }
    .empty { text-align: center; color: var(--ww-ok); font-size: 12px; padding: 4px 0; }
    .loading, .load-error { text-align: center; color: var(--ww-muted); font-size: 12px; padding: 8px 0; }
    .load-error { color: var(--ww-nok); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/javascript">
    var CATS = [
      { key: 'lowBattery', icon: '🔋', labelKey: 'widget.lowBattery' },
      { key: 'notReporting', icon: '📡', labelKey: 'widget.notReporting' },
      { key: 'unavailable', icon: '🔌', labelKey: 'widget.unavailable' },
    ];
    var CATS_BY_KEY = {};
    CATS.forEach(function (cat) { CATS_BY_KEY[cat.key] = cat; });

    // At most one category section open at a time (tap a chip to switch, tap the open
    // one again to close) - reset on every reload, doesn't need to persist across
    // widget instances.
    var expandedCat = null;
    var refreshTimer = null;
    // Last rendered summary, so a periodic/scan re-fetch that finds nothing new skips
    // the DOM rebuild entirely instead of a needless flicker.
    var lastDataJson = null;

    function escapeHtml(str) {
      return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // Driver-declared battery type(s), e.g. ["AA","AA"] -> "2x AA" - not every app
    // declares this, so it's frequently absent even for a device with a real battery.
    function formatBatteryTypes(types) {
      if (!Array.isArray(types) || !types.length) return '';
      var counts = {};
      var order = [];
      types.forEach(function (t) {
        if (!counts[t]) { counts[t] = 0; order.push(t); }
        counts[t] += 1;
      });
      return order.map(function (t) { return (counts[t] > 1 ? counts[t] + 'x ' : '') + t; }).join(', ');
    }

    function detailLine(Homey, catKey, entry) {
      if (catKey === 'lowBattery') {
        var typeLabel = entry.batteryTypeOverride || formatBatteryTypes(entry.batteryTypes);
        var parts = [entry.battery || '', typeLabel].filter(Boolean);
        return escapeHtml(parts.join(' · '));
      }
      if (catKey === 'notReporting' && entry.lastUpdated) {
        return Homey.__('widget.lastUpdated', { date: new Date(entry.lastUpdated).toLocaleString() });
      }
      if (catKey === 'unavailable' && entry.lastSeenAt) {
        return Homey.__('widget.lastSeen', { date: new Date(entry.lastSeenAt).toLocaleString() });
      }
      return '';
    }

    // One <div class="detail"> line per category a device is flagged in, e.g. a device
    // that's both unavailable and not reporting (common - if Homey lost the connection
    // it's obviously also not sending new data) gets two lines, not two separate rows.
    function detailLinesHtml(Homey, catEntries) {
      return catEntries.map(function (ce) {
        var sinceText = ce.entry.since ? Homey.__('widget.since', { date: new Date(ce.entry.since).toLocaleString() }) : '';
        var detailText = detailLine(Homey, ce.cat.key, ce.entry);
        var parts = [ce.cat.icon + ' ' + Homey.__(ce.cat.labelKey)].concat([sinceText, detailText].filter(Boolean));
        return '<div class="detail">' + parts.join(' · ') + '</div>';
      }).join('');
    }

    function deviceRowHtml(Homey, name, zone, catEntries) {
      return '' +
        '<div class="device-row">' +
          '<span class="name">' + escapeHtml(name) + '</span>' +
          (zone ? ' <span class="zone">(' + escapeHtml(zone) + ')</span>' : '') +
          detailLinesHtml(Homey, catEntries) +
        '</div>';
    }

    function sectionHtml(Homey, cat, count, list) {
      var rows = list.map(function (entry) {
        return deviceRowHtml(Homey, entry.name, entry.zone, [{ cat: cat, entry: entry }]);
      }).join('');
      return '' +
        '<div class="section">' +
          '<h4>' + Homey.__(cat.labelKey) + '</h4>' +
          '<div class="device-list">' + rows + '</div>' +
        '</div>';
    }

    // "Show all" view (no filter): one row per unique device across every category it's
    // flagged in, instead of one section per category (which would repeat a device that
    // has e.g. both a low battery and is unavailable).
    function mergedListHtml(Homey, lists) {
      var byId = {};
      var order = [];
      CATS.forEach(function (cat) {
        lists[cat.key].forEach(function (entry) {
          if (!byId[entry.id]) {
            byId[entry.id] = { name: entry.name, zone: entry.zone, catEntries: [] };
            order.push(entry.id);
          }
          byId[entry.id].catEntries.push({ cat: cat, entry: entry });
        });
      });
      order.sort(function (a, b) { return byId[a].name.localeCompare(byId[b].name); });
      var rows = order.map(function (id) {
        var d = byId[id];
        return deviceRowHtml(Homey, d.name, d.zone, d.catEntries);
      }).join('');
      return '<div class="section"><div class="device-list">' + rows + '</div></div>';
    }

    function render(Homey, data) {
      var root = document.getElementById('root');
      var counts = data.counts || { lowBattery: 0, notReporting: 0, unavailable: 0 };
      var lists = {
        lowBattery: data.lowBattery || [],
        notReporting: data.notReporting || [],
        unavailable: data.unavailable || [],
      };

      var chipsHtml = CATS.map(function (cat) {
        var count = counts[cat.key] || 0;
        var classes = 'chip' + (count > 0 ? ' warn' : '') + (expandedCat === cat.key ? ' active' : '');
        return '' +
          '<div class="' + classes + '" data-cat="' + cat.key + '">' +
            '<div class="num">' + cat.icon + ' ' + count + '</div>' +
            '<div class="lbl">' + Homey.__(cat.labelKey) + '</div>' +
          '</div>';
      }).join('');

      var allOk = !counts.lowBattery && !counts.notReporting && !counts.unavailable;

      // No filter tapped (the default on load) shows every affected device at once
      // (merged/deduplicated - see mergedListHtml), so a problem is visible immediately
      // without having to tap anything. Tapping a chip narrows it down to just that one
      // category; tapping it again goes back to "show all" rather than to nothing.
      var sectionsHtml = allOk ? '' : (expandedCat && (counts[expandedCat] || 0)
        ? sectionHtml(Homey, CATS_BY_KEY[expandedCat], counts[expandedCat], lists[expandedCat])
        : mergedListHtml(Homey, lists));

      root.innerHTML = '' +
        '<div class="counts">' + chipsHtml + '</div>' +
        (allOk ? '<div class="empty">✓ ' + Homey.__('widget.noProblems') + '</div>' : sectionsHtml) +
        '<div class="footer">' +
          '<button class="scan-btn" id="scan-btn">' + Homey.__('widget.scanNow') + '</button>' +
          '<span class="last-scan">' + (data.lastScanAt ? new Date(data.lastScanAt).toLocaleTimeString() : '') + '</span>' +
        '</div>';

      var chips = root.querySelectorAll('.chip');
      for (var i = 0; i < chips.length; i += 1) {
        (function (chip) {
          chip.addEventListener('click', function () {
            var cat = chip.getAttribute('data-cat');
            if (!(counts[cat] || 0)) return;
            expandedCat = (expandedCat === cat) ? null : cat;
            if (Homey.hapticFeedback) { try { Homey.hapticFeedback(); } catch (err) { /* no-op */ } }
            render(Homey, data);
          });
        }(chips[i]));
      }

      var scanBtn = document.getElementById('scan-btn');
      scanBtn.addEventListener('click', function () {
        scanBtn.disabled = true;
        scanBtn.textContent = Homey.__('widget.scanning');
        Homey.api('POST', '/scan')
          .then(function () { return fetchSummary(Homey); })
          .catch(function (err) { console.error(err); })
          .then(function () {
            // If the fetch found nothing new, render() never re-ran and this is still
            // the same button node - reset it directly instead of leaving it stuck.
            var btn = document.getElementById('scan-btn');
            if (btn) { btn.disabled = false; btn.textContent = Homey.__('widget.scanNow'); }
          });
      });

      resizeToContent(Homey);
    }

    function resizeToContent(Homey) {
      // Measured on <body>, not #root: body carries its own top/bottom padding which
      // isn't part of #root's own scrollHeight, and leaving it out here was clipping
      // that padding (and whatever sits right above it, e.g. the scan button) off the
      // bottom of the widget.
      var height = Math.min(760, document.body.scrollHeight + 2);
      Homey.setHeight(height);
    }

    function showError(Homey) {
      document.getElementById('root').innerHTML = '<div class="load-error">' + Homey.__('widget.loadFailed') + '</div>';
      resizeToContent(Homey);
    }

    function fetchSummary(Homey) {
      return Homey.api('GET', '/summary')
        .then(function (data) {
          var json = JSON.stringify(data);
          if (json === lastDataJson) return; // nothing changed - skip the rebuild/flicker
          lastDataJson = json;
          render(Homey, data);
        })
        .catch(function (err) {
          console.error(err);
          lastDataJson = null;
          showError(Homey);
        });
    }

    function onHomeyReady(Homey) {
      document.getElementById('root').innerHTML = '<div class="loading">' + Homey.__('widget.loading') + '</div>';
      Homey.ready({ height: 90 });
      // A real scan on open (not just reading the last cached result) also re-syncs
      // realtime availability for every device against Homey right now (see
      // _handleDeviceUpdate in app.js) - catches a stuck "unavailable" that a missed
      // realtime event left behind, not just stale notReporting/lowBattery numbers.
      Homey.api('POST', '/scan')
        .catch(function (err) { console.error(err); })
        .then(function () { return fetchSummary(Homey); });
      // Widgets aren't pushed updates - periodic re-fetch (no full scan) so a dashboard
      // left open doesn't show stale counts forever either.
      refreshTimer = setInterval(function () { fetchSummary(Homey); }, 60000);
    }
  </script>
</body>
</html>
